
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard | SkillSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#172554">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">SkillSync Admin</a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light" type="submit">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">
    <h1 class="fw-bold">Administrator Dashboard</h1>
    <p class="text-muted">
        Manage students and career skill requirements.
    </p>

    <div class="row g-3 mt-3">
        <div class="col-md-6">
            <div class="card p-4">
                <h5>Student Management</h5>
                <p>View and manage student records.</p>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-4">
                <h5>Job Role Management</h5>
                <p>Manage job roles and required skills.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>

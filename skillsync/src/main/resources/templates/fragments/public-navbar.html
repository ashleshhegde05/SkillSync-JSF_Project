<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="publicNavbar" class="public-navbar">

    <a th:href="@{ / }" class="public-brand">
        Skill<span>Sync</span>
    </a>

    <nav class="public-nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}" class="register-link">Register</a>
    </nav>

</header>

<style>
    .public-navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        height: 70px;
        padding: 0 7%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(16, 26, 46, 0.85);
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        z-index: 1000;
    }

    .public-brand {
        color: #ffffff;
        font-size: 25px;
        font-weight: bold;
        text-decoration: none;
    }

    .public-brand span {
        color: #93c5fd;
    }

    .public-nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
    }

    .public-nav-links a {
        color: #e2e8f0;
        text-decoration: none;
        font-size: 15px;
    }

    .public-nav-links a:hover {
        color: #93c5fd;
    }

    .public-nav-links .register-link {
        padding: 9px 17px;
        background: #2563eb;
        color: #ffffff;
        border-radius: 5px;
    }

    .public-nav-links .register-link:hover {
        background: #1d4ed8;
    }

    @media (max-width: 480px) {
        .public-navbar {
            padding: 0 16px;
        }

        .public-nav-links {
            gap: 14px;
        }

        .public-brand {
            font-size: 21px;
        }
    }
</style>

</body>
</html>

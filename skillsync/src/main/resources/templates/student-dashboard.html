
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Dashboard | SkillSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#172554">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">SkillSync</a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light" type="submit">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">
    <h1 class="fw-bold">Student Dashboard</h1>
    <p class="text-muted">
        Welcome to your SkillSync career-readiness portal.
    </p>

    <div class="row g-3 mt-3">
        <div class="col-md-4">
            <div class="card p-3 h-100">
                <h5>My Profile</h5>
                <p>Manage your academic and personal details.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 h-100">
                <h5>My Skills</h5>
                <p>Track your technical and soft skills.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 h-100">
                <h5>My Projects</h5>
                <p>Showcase your academic projects and certifications.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
